name: Setup game quiz render
description: Node, dependencies, optional voiceover archive, game:prepare
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Extract voiceover clips (clips_game.7z, optional)
      shell: bash
      run: |
        if [ -f clips_game.7z ]; then
          pip install --quiet py7zr
          python3 -c "import py7zr; py7zr.SevenZipFile('clips_game.7z').extractall('.')"
          ls clips_game | head -5
        else
          echo "no clips_game.7z -> default timing (6 s countdown + 2 s reveal, no voiceover)"
        fi
    - name: Prepare (image flags + voiceover durations)
      shell: bash
      run: npm run game:prepare
